# Development override: build the backend/web images from the current checkout
# instead of pulling the official GHCR images.

services:
  backend:
    image: multica-backend:dev
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ALPINE_REPO: ${ALPINE_REPO:-https://dl-cdn.alpinelinux.org/alpine}
        ALPINE_REPO_FALLBACKS: ${ALPINE_REPO_FALLBACKS:-https://mirrors.aliyun.com/alpine https://mirrors.tuna.tsinghua.edu.cn/alpine http://mirrors.aliyun.com/alpine http://mirrors.tuna.tsinghua.edu.cn/alpine}
        GO_MODULE_PROXY: ${GO_MODULE_PROXY:-https://proxy.golang.org,direct}
        GO_MODULE_PROXY_FALLBACK: ${GO_MODULE_PROXY_FALLBACK:-https://goproxy.cn,direct}
        GO_MODULE_SUMDB: ${GO_MODULE_SUMDB:-sum.golang.org}
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        DATE: ${DATE:-unknown}

  frontend:
    image: multica-web:dev
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        REMOTE_API_URL: http://backend:8080
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_APP_VERSION: dev
